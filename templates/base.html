<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Comofi{% endblock %} · Conciliación financiera</title>
  <style>
    :root {
      --oliva: #6B7140;
      --terracota: #C56B4B;
      --crema: #E8E2CE;
      --crema-claro: #F2E3D5;
      --tinta: #3A3628;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--crema);
      color: var(--tinta);
      line-height: 1.5;
    }
    header {
      background: var(--oliva);
      color: var(--crema-claro);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    header h1 { margin: 0; font-size: 1.4rem; letter-spacing: 0.04em; }
    header a { color: var(--crema-claro); text-decoration: none; font-size: 0.95rem; }
    main { max-width: 1080px; margin: 0 auto; padding: 2rem; }
    h2 { color: var(--oliva); border-bottom: 2px solid var(--oliva); padding-bottom: 0.3rem; }
    .card {
      background: var(--crema-claro);
      border: 1px solid var(--oliva);
      border-radius: 6px;
      padding: 1.4rem;
      margin-bottom: 1.6rem;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: block; font-weight: bold; color: var(--oliva); margin-bottom: 0.35rem; }
    input[type="file"] { width: 100%; padding: 0.5rem; }
    button, .btn {
      background: var(--terracota);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 0.65rem 1.4rem;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn:hover { filter: brightness(1.08); }
    table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
    th { background: var(--oliva); color: var(--crema-claro); text-align: left; padding: 0.5rem 0.7rem; }
    td { padding: 0.45rem 0.7rem; border-bottom: 1px solid #d8d2bc; }
    tr:nth-child(even) td { background: rgba(107, 113, 64, 0.06); }
    .flash { border-left: 5px solid var(--oliva); padding: 0.7rem 1rem; margin-bottom: 1rem;
             background: var(--crema-claro); }
    .flash.error { border-left-color: var(--terracota); }
    .badge { display: inline-block; padding: 0.1rem 0.55rem; border-radius: 999px;
             font-size: 0.8rem; background: var(--oliva); color: var(--crema-claro); }
    .badge.alerta { background: var(--terracota); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    footer { text-align: center; color: var(--oliva); padding: 1.5rem; font-size: 0.9rem; }
    .muted { color: #7b7660; font-size: 0.88rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}">Comofi</a></h1>
    <span>Conciliación de movimientos financieros</span>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Programa creado por Sebastián Romero</footer>
</body>
</html>
